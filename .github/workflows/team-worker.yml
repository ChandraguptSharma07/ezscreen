name: ezscreen Team Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, prepare_upload, run_kaggle, or collect"
        required: false
        default: "auto"
      worker_job_id:
        description: "Optional worker job id override"
        required: false

jobs:
  team-worker:
    name: Team worker
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      EZSCREEN_TEAM_TOKEN: ${{ secrets.EZSCREEN_TEAM_TOKEN }}
      EZSCREEN_TEAM_SERVER_URL: ${{ secrets.EZSCREEN_TEAM_SERVER_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker runtime
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run team worker mode
        run: |
          python -m ezscreen.team.worker             --mode "${{ github.event.inputs.mode || 'auto' }}"             --worker-job-id "${{ github.event.inputs.worker_job_id }}"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-worker-${{ github.run_id }}
          path: |
            team_worker_runs/**
          if-no-files-found: ignore
